name: 'Commit Report'
description: 'Generate Git commit statistics report'
branding:
  icon: 'bar-chart-2'
  color: 'blue'

inputs:
  period:
    description: 'Time period (7d/1m/3m/6m/1y/all)'
    required: false
    default: '3m'
  format:
    description: 'Output format (html/json/markdown)'
    required: false
    default: 'json'
  output:
    description: 'Output file name'
    required: false
    default: 'commit-report.json'
  author:
    description: 'Filter by author name'
    required: false
  compare:
    description: 'Compare with previous period (e.g. 3m, previous)'
    required: false
  directory:
    description: 'Directory to scan'
    required: false
    default: '.'
  comment:
    description: 'Post summary as PR comment (true/false)'
    required: false
    default: 'false'

outputs:
  report-path:
    description: 'Path to the generated report file'
  total-commits:
    description: 'Total number of commits in the period'
  active-authors:
    description: 'Number of active authors'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install commit-report
      shell: bash
      run: npm install -g commit-report

    - name: Generate report
      id: generate
      shell: bash
      run: |
        ARGS="--quiet --format ${{ inputs.format }} --output ${{ inputs.output }} --period ${{ inputs.period }}"
        if [ -n "${{ inputs.author }}" ]; then
          ARGS="$ARGS --author ${{ inputs.author }}"
        fi
        if [ -n "${{ inputs.compare }}" ]; then
          ARGS="$ARGS --compare ${{ inputs.compare }}"
        fi
        commit-report ${{ inputs.directory }} $ARGS

    - name: Extract metrics
      id: metrics
      if: inputs.format == 'json'
      shell: bash
      run: |
        if [ -f "${{ inputs.output }}" ]; then
          COMMITS=$(node -e "const d=JSON.parse(require('fs').readFileSync('${{ inputs.output }}','utf8'));console.log(d.stats.totalCommits||0)")
          AUTHORS=$(node -e "const d=JSON.parse(require('fs').readFileSync('${{ inputs.output }}','utf8'));console.log((d.stats.authors||[]).length)")
          echo "report-path=${{ inputs.output }}" >> $GITHUB_OUTPUT
          echo "total-commits=$COMMITS" >> $GITHUB_OUTPUT
          echo "active-authors=$AUTHORS" >> $GITHUB_OUTPUT
        fi

    - name: Comment on PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request' && inputs.format == 'json'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('${{ inputs.output }}', 'utf8'));
          const stats = data.stats;
          let body = `## 📊 Commit Report\n\n`;
          body += `| Metric | Value |\n|--------|-------|\n`;
          body += `| Commits | ${stats.totalCommits} |\n`;
          body += `| Lines Added | +${stats.linesAdded} |\n`;
          body += `| Lines Deleted | -${stats.linesDeleted} |\n`;
          body += `| Active Authors | ${(stats.authors || []).length} |\n`;

          if (data.compare) {
            const d = data.compare.delta;
            body += `\n### Period Comparison\n`;
            body += `| Metric | Change |\n|--------|--------|\n`;
            body += `| Commits | ${d.commits.percentage >= 0 ? '+' : ''}${d.commits.percentage}% |\n`;
            body += `| Lines Added | ${d.linesAdded.percentage >= 0 ? '+' : ''}${d.linesAdded.percentage}% |\n`;
          }

          body += `\n*Generated by [commit-report](https://www.npmjs.com/package/commit-report)*`;

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: body
          });
